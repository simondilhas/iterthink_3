[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iterthink"
version = "2.0.0a0"
description = "iterthink 2.0 — local-first project workspace"
readme = "README.md"
license = { text = "BUSL-1.1" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "rapidfuzz>=3.6.0",
    "keyring>=25.0",
    "opencv-python-headless>=4.9.0",
    "fastembed>=0.8.0",
    "huggingface-hub>=0.26.0",
    "llama-cpp-python>=0.3.4",
    "sqlite-vec>=0.1.9",
    "markdown-it-py>=4.1.0",
    "mdit-py-plugins>=0.4.0",
    "pyspellchecker>=0.8.0",
    "langdetect>=1.0.9",
    "rapidocr>=3.8.0",
    "onnxruntime>=1.17.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
    "mcp>=1.2",
    "daff>=1.3.46",
    "openpyxl>=3.1",
    "watchdog>=4.0",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
iterthink = "iterthink.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["iterthink*"]

[tool.setuptools.package-data]
iterthink = [
    "help.md",
    "THIRD_PARTY_NOTICES.md",
    "defaults/**/*",
    "templates/*",
    "alembic/env.py",
    "alembic/script.py.mako",
    "alembic/versions/*.py",
    "web/templates/**/*",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: real files, real SQLite, several modules",
    "jj: needs the jj binary; 2.0 does not use jj",
    "slow: takes more than 1 s; only in --full",
    "e2e: full user flow through the FastAPI TestClient",
    "network: may open non-loopback sockets",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["iterthink/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S", "PTH"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S603"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
