name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  UV_PYTHON: "3.12"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra ifc
      - run: uv run python scripts/check.py
