{% extends "base.html" %}
{% block title %}iterthink{% endblock %}
{% block head %}
{% include "home/head.html" %}
<meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
{% endblock %}
{% block line %}
<script type="module" src="/static/js/the-line.js"></script>
<div class="start">
  <form class="line-row" method="post" action="/line" hx-post="/line" hx-target="#search-results" hx-swap="innerHTML">
    <input id="line" name="q" placeholder="What do you want to achieve?" autocomplete="off" autofocus>
    <span class="dot" data-state="idle" aria-hidden="true"></span>
  </form>
  <div id="search-results"></div>
</div>
<details class="menu">
  <summary aria-label="Menu"><span></span><span></span><span></span></summary>
  <div class="menu-panel">
    <form method="post" action="/line" hx-post="/line" hx-target="#search-results" hx-swap="innerHTML">
      <input type="hidden" name="q" value="open project">
      <button type="submit">Open project</button>
    </form>
    <form method="post" action="/open" hx-post="/open" hx-target="#search-results" hx-swap="innerHTML">
      <it-folder-picker>
        <label>Folder path <input name="path" type="text" spellcheck="false" placeholder="/path/to/folder"></label>
        <button type="submit">Open folder</button>
      </it-folder-picker>
    </form>
    {% if has_route(request, "settings_home") %}
    <a href="/settings">Settings</a>
    {% endif %}
  </div>
</details>
{% endblock %}
