<ul>
  {% if folder %}
  <li>
    <form method="post" action="/projects">
      <input type="hidden" name="path" value="{{ folder }}">
      <span>{{ folder.name }} (this folder)</span>
      <button type="submit">Make project</button>
    </form>
  </li>
  {% endif %}
  {% for entry in folders %}
  <li>
    {% if entry.project_id %}
    <a href="/p/{{ entry.project_id }}">{{ entry.name }}</a>
    {% else %}
    <form method="post" action="/projects">
      <input type="hidden" name="path" value="{{ entry.path }}">
      <span>{{ entry.name }}</span>
      <button type="submit">Make project</button>
    </form>
    {% endif %}
  </li>
  {% endfor %}
</ul>
