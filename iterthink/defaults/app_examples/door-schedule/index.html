<main>
  <h1>Door schedule</h1>
  <button id="run" type="button">Run</button>
  <pre id="out"></pre>
  <script>
    document.getElementById("run").addEventListener("click", function () {
      bridge.queryIfc({
        path: "model.ifc",
        ifc_class: "IfcDoor",
        psets: ["Pset_DoorCommon"]
      }).then(function (rows) {
        document.getElementById("out").textContent = JSON.stringify(rows);
      });
    });
  </script>
</main>
